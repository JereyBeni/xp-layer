[package]
name = "xp-layer"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Windows XP API translation layer in Rust (Linux & Windows — not for Apple fuckers and glazers)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JereyBeni/xp-layer"
readme = "README.md"

[dependencies]
eframe = "0.29"
egui = "0.29"
sysinfo = "0.32"
raw-cpuid = "11"

[profile.release]
lto = true
codegen-units = 1
